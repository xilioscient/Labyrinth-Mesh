[workspace]
members = [
    ".",
    "labyrinth-cli",
    "labyrinth-tui",
    "labyrinth-server",
]
resolver = "2"

[package]
name = "labyrinth-core"
version = "2.0.0"
edition = "2021"
description = "Labyrinth-Mesh core — post-quantum resilient multi-path tunneling"
authors = ["Alessandro Faraone"]
license = "MIT"

[dependencies]
# Phase 1: GF(2^8) Arithmetic + Shamir Secret Sharing + parallelism
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"
rayon = "1.8"

# Phase 2: Post-Quantum Onion Encapsulation
pqcrypto-kyber = "0.7"
pqcrypto-traits = "0.3"
aes-gcm-siv = "0.11"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
hkdf = "0.12"
sha2 = "0.10"
generic-array = "0.14"

# Phase 3: Protocol Morphing Engine
chacha20 = "0.9"

# Phase 4: cross-platform utilities
libc = "0.2"
memoffset = "0.9"
bytes = "1.5"

# v2: Labyrinth-Mesh — sharks SSS + BLAKE3 auth + Dilithium3 sender auth + X25519 hybrid KEM
sharks = "0.5"
blake3 = "1.5"
pqcrypto-dilithium = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Management plane HTTP API
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dashboard TUI
ratatui = "0.26"
crossterm = "0.27"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls", "http2"] }
rcgen = "0.13"
hyper = { version = "1", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
aes-gcm = "0.10"
hmac = "0.12"
http-body-util = "0.1"

# Common utilities
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# GUI backend — CORS + SSE
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# Optional: TPM 2.0 hardware identity
tss-esapi = { version = "=8.0.0-alpha.2", optional = true }
p256 = { version = "0.14", features = ["ecdsa"], optional = true }

# Optional: io_uring async file I/O
tokio-uring = { version = "0.5", optional = true }

# Phase 4 & 5: Linux-only kernel bypass + anti-debug
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.12"
procfs = "0.16"

[[bin]]
name = "labyrinth_mesh"
path = "src/bin/labyrinth_mesh.rs"

[features]
tpm = ["tss-esapi", "p256"]
io-uring = ["tokio-uring"]

[dev-dependencies]
criterion = "0.5"
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
opt-level = 3
lto = true
debug = true
