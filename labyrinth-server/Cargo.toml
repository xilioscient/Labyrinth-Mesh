[package]
name = "labyrinth-server"
version = "2.0.0"
edition = "2021"
description = "Labyrinth-Mesh management server — standalone HTTP API"
authors = ["Alessandro Faraone"]

[[bin]]
name = "labyrinth-server"
path = "src/main.rs"

[dependencies]
labyrinth-core = { path = ".." }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
