[package]
name = "labyrinth-tui"
version = "2.0.0"
edition = "2021"
description = "Labyrinth-Mesh TUI — ratatui live dashboard (Phase 3)"
authors = ["Alessandro Faraone"]

[[bin]]
name = "labyrinth-tui"
path = "src/main.rs"

[dependencies]
labyrinth-core = { path = ".." }
ratatui = "0.26"
crossterm = "0.27"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
